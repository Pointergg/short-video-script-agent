[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "short-video-script-agent"
version = "0.1.0"
description = "Evidence-first tool-using short video script agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
script-agent = "script_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
